[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-agent"
version = "2.0.0-beta.2"
description = "ICE Loop 公众号文章生产 Agent 引擎（写作流水线/国内模型适配/规则引擎/操作账本）"
requires-python = ">=3.12"
dependencies = ["Pillow>=10,<13", "pydantic>=2.13,<3", "markdown-it-py==4.2.0", "httpx==0.28.1", "httpcore==1.0.9"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["fastapi>=0.115,<1", "httpx>=0.27,<1"]

[project.scripts]
ice-agent = "ice_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ice_agent*"]

[tool.setuptools.package-data]
ice_agent = ["resources/*.json"]
